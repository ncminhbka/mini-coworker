[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minicw"
version = "0.1.0"
description = "Mini coworker: a small terminal AI coworker harness (a study reimplementation of OpenWorker's core)"
requires-python = ">=3.11"
dependencies = [
    "rich>=13",
    "prompt_toolkit>=3",
    "ddgs>=9",
]

[project.optional-dependencies]
google = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
]
dev = ["pytest>=8"]

[project.scripts]
minicw = "minicw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minicw = ["personas/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
